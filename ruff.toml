# zhvault ruff config (explicit; avoids inheriting unexpected defaults)
line-length = 100
target-version = "py310"
src = ["src"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "C4", "FLY", "RUF"]
ignore = [
  "B008",   # Typer Option()/Argument() defaults
  "E501",   # line length; formatter/hand wrap later
]

[lint.per-file-ignores]
"src/tests/**" = ["E402"]  # pytest imports sometimes after fixtures/helpers
