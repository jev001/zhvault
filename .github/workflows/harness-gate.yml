name: harness-gate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    name: harness-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync (dev + gate extras)
        run: uv sync --extra dev --extra chroma --extra kuzu --extra rocksdb
      - name: make gate
        run: make gate
