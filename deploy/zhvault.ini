# zhvault deploy profile — used by deploy/run.sh
# Override path: ZHVAULT_INI=/path/to/other.ini

[common]
data_dir = data
engine = sqlite
# true → pass --json (logs on stderr, events on stdout)
json = true
# optional: cookie_file = Cookies.json
# optional: x_zse_96 =

[lock]
# pid files live under data/run/{job}.pid (relative to repo root)
dir = data/run

# --- jobs: ./deploy/run.sh <name>  →  [run.<name>] ---

[run.backup]
cmd = backup
source = collection
# full = false

[run.backup-all]
cmd = backup
source = all

[run.backup-social]
cmd = backup
source = social

[run.resume]
cmd = resume

[run.status]
cmd = status
