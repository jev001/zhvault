[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhvault"
version = "0.1.0"
description = "Backup Zhihu collections/pins/questions/votes to markdown + assets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests~=2.32.3",
  "html2text~=2024.2.26",
  "PyYAML~=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2", "pre-commit>=3.5"]
chroma = ["chromadb>=0.5"]
kuzu = ["kuzu>=0.4"]
rocksdb = ["rocksdict>=0.3"]
search-ml = ["sentence-transformers>=3.0"]

[project.scripts]
zhvault = "cli:main"
zhihu-backup = "cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
markers = [
    "chroma: tests that require the optional chromadb extra",
    "kuzu: tests that require the optional kuzu extra",
    "rocksdb: tests that require the optional rocksdict (zhvault[rocksdb]) extra",
]

[tool.ruff]
# Rule selection lives in ./ruff.toml (single source of truth).
line-length = 100
target-version = "py310"
src = ["src"]
