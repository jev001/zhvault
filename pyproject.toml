[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhihu-backup"
version = "0.1.0"
description = "Backup Zhihu collections/pins/questions/votes to markdown + assets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests~=2.32.3",
  "html2text~=2024.2.26",
  "PyYAML~=6.0",
]

[project.scripts]
zhihu-backup = "zhihu_backup.cli:main"

[tool.setuptools.packages.find]
include = ["zhihu_backup*"]
